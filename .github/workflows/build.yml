name: 📦 Build RemoteMouse APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: ⬇️ Installer Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          echo "$PWD/gradle-8.2/bin" >> $GITHUB_PATH

      - name: 🛠️ Générer gradle-wrapper.jar
        run: gradle wrapper --gradle-version 8.2

      - name: 🔑 Droits d'exécution
        run: chmod +x gradlew

      - name: 🧹 Nettoyer
        run: ./gradlew clean

      - name: 🔨 Compiler APK
        run: ./gradlew assembleDebug --stacktrace

      - name: ✅ Vérifier APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: 📤 Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: 📲 RemoteMouse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
