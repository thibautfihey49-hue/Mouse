name: 📦 Build RemoteMouse APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Configurer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: 🔑 Donner les droits d'exécution
        run: chmod +x gradlew

      - name: 🧹 Nettoyer le projet
        run: ./gradlew clean

      - name: 🔨 Compiler l'APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: 📤 Télécharger l'APK fini
        uses: actions/upload-artifact@v4
        with:
          name: RemoteMouse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
